<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17160f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Край доски: шахматные головоломки в Telegram. Проведите пешку через доску, разберите пробку фигур и удержите короля в полосе."
    />
    <meta property="og:title" content="Край доски" />
    <meta
      property="og:description"
      content="Три режима на одной доске: пешка сквозь фигуры, пробка и король в полосе."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Край доски</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Заводской цвет до загрузки стилей; дальше оба следует за темой
           поля, иначе на светлой теме за краем экрана торчит тёмная подложка. */
        background: var(--bg, #17160f);
        color: var(--ink, #e9e2d1);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .boot-static {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 15px;
        letter-spacing: 0.02em;
        color: #a69e8c;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-static">Край доски</div>
    </div>
    <noscript>Для игры нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
